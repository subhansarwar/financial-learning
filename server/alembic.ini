# Alembic configuration for the Financial Learning Platform backend.
# The database URL is NOT set here — alembic/env.py pulls it from app.core.config.settings
# (i.e. the same .env the app uses).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Timezone-naive UTC timestamps in generated revision files.
# timezone =

[post_write_hooks]

# Logging --------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
